<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta http-equiv="refresh" content="5" /> -->
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="card" id="search-form">
        <div class="card-body">
          <form action="" method="post" onsubmit="handleSubmit(event, this)">
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">First Name</span>
              </div>
              <input
                type="text"
                class="form-control"
                name="firstname"
                id="firstname"
                placeholder="First Name"
              />
            </div>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">Last Name</span>
              </div>
              <input
                type="text"
                class="form-control"
                name="lastname"
                id="lastname"
                placeholder="Last Name"
              />
            </div>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">SSN</span>
              </div>
              <input
                type="number"
                class="form-control"
                name="ssn"
                id="ssn"
                placeholder="SSN"
              />
            </div>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">Date of Birth</span>
              </div>
              <input
                type="date"
                class="form-control"
                name="dob"
                id="dob"
                placeholder="Date of Birth"
              />
            </div>
            <hr />
            <div class="d-flex justify-content-center">
              <div class="btn-group">
                <button class="btn btn-primary" type="submit">Search</button>
                <button class="btn btn-outline-primary" type="reset">
                  Clear
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card d-none" id="search-result"></div>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>

    <script>
      async function handleSubmit(e, form) {
        e.preventDefault();
        const formData = new FormData(form);
        const data = {};
        let validation = false;
        for (let [name, value] of formData.entries()) {
          if (value) validation = true;
          console.log(`${name}: ${value}`);
          data[name] = value;
        }
        if (!validation) return;

        $("#search-form").toggleClass("d-none");
        $("#search-result").html(`
          <div class="card-header">
            <div class="card-header-text">
              <div
                class="btn badge badge-pill badge-primary badge-sm"
                onclick="handleBackSearchPage()"
              >
                Back
              </div>
              Star Home Care
            </div>
          </div>
          <div class="card-body">
            <div class="d-flex">
              <div class="col-6 p-2">
                <div class="border p-2">
                  <div class="d-flex">
                    <div class="col-4">First Name:</div>
                    <div class="col-8">${data.firstname}</div>
                  </div>
                  <div class="d-flex">
                    <div class="col-4">Last Name:</div>
                    <div class="col-8">${data.lastname}</div>
                  </div>
                </div>
              </div>
              <div class="col-6 p-2">
                <div class="border p-2">
                  <div class="d-flex">
                    <div class="col-4">SSN:</div>
                    <div class="col-8">${data.ssn}</div>
                  </div>
                  <div class="d-flex">
                    <div class="col-4">Date Of Birth:</div>
                    <div class="col-8">${data.dob}</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex">
              <table class="table">
                <thead>
                  <tr>
                    <th>Type / Site</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>OIG Exclusion</span>
                        <span>https://exclusions.oig.hhs.gov</span>
                      </div>
                    </td>
                    <td id="td3"><div class="spinner-border" role="status">
  <span class="sr-only">Loading...</span>
</div></td>
                  </tr>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>OIG HHSC</span>
                        <span
                          >https://oig.hhsc.state.tx.us/oigportal2/Exclusions</span
                        >
                      </div>
                    </td>
                    <td id="td4"><div class="spinner-border" role="status">
  <span class="sr-only">Loading...</span>
</div></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="d-flex flex-column">
              <p>https://exclusions.oig.hhs.gov</p>
              <textarea name="" id="exclusions-result" class="w-100 d-none"></textarea>
              <p>https://oig.hhsc.state.tx.us/oigportal2/Exclusions</p>
              <textarea name="" id="hhsc-result" class="w-100 d-none"></textarea>
            </div>
          </div>`);
        $("#search-result").toggleClass("d-none");

        try {
          const response = await fetch(
            `/exclusions-oig?first=${data.firstname}&last=${data.lastname}`
          );
          const exclusions = await response.json();
          if (exclusions.status) $("#td3").html("Good");
          else {
            $("#td3").html("Bad");
            $("#exclusions-result").text(JSON.stringify(exclusions, null, 4));
            $("#exclusions-result").toggleClass("d-none");
          }
        } catch (e) {
          $("#td3").html("N/A");
        }

        try {
          const response = await fetch(
            `/oig-hhsc?first=${data.firstname}&last=${data.lastname}`
          );
          const hhsc = await response.json();
          if (hhsc.status) $("#td4").html("Good");
          else {
            $("#td4").html("Bad");
            $("#hhsc-result").text(JSON.stringify(hhsc, null, 4));
            $("#hhsc-result").toggleClass("d-none");
          }
        } catch (e) {
          $("#td4").html("N/A");
        }
      }

      function handleBackSearchPage() {
        $("#search-form").toggleClass("d-none");
        $("#search-result").toggleClass("d-none");
      }
    </script>

    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
