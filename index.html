<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta http-equiv="refresh" content="5" /> -->
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="card" id="search-form">
        <div class="card-body">
          <form action="" method="post" onsubmit="handleSubmit(event, this)">
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">First Name</span>
              </div>
              <input
                type="text"
                class="form-control"
                name="firstname"
                id="firstname"
                placeholder="First Name"
              />
            </div>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">Last Name</span>
              </div>
              <input
                type="text"
                class="form-control"
                name="lastname"
                id="lastname"
                placeholder="Last Name"
              />
            </div>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">SSN</span>
              </div>
              <input
                type="number"
                class="form-control"
                name="ssn"
                id="ssn"
                placeholder="SSN"
              />
            </div>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">Date of Birth</span>
              </div>
              <input
                type="date"
                class="form-control"
                name="dob"
                id="dob"
                placeholder="Date of Birth"
              />
            </div>
            <hr />
            <div class="d-flex justify-content-center">
              <div class="btn-group">
                <button class="btn btn-primary" type="submit">Search</button>
                <button class="btn btn-outline-primary" type="reset">
                  Clear
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card d-none" id="search-result"></div>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>

    <script>
      let statusData = [0, 0, 0, 0, 0];
      function handleSubmit(e, form) {
        e.preventDefault();
        const formData = new FormData(form);
        const data = {};
        let validation = false;
        for (let [name, value] of formData.entries()) {
          if (value) validation = true;
          console.log(`${name}: ${value}`);
          data[name] = value;
        }
        if (!validation) return;

        //  xxx

        statusData = [1, 0, 1, 2, 0];

        $("#search-form").toggleClass("d-none");
        $("#search-result").html(`
          <div class="card-header">
            <div class="card-header-text">
              <div
                class="btn badge badge-pill badge-primary badge-sm"
                onclick="handleBackSearchPage()"
              >
                Back
              </div>
              Star Home Care
            </div>
          </div>
          <div class="card-body">
            <div class="d-flex">
              <div class="col-6 p-2">
                <div class="border p-2">
                  <div class="d-flex">
                    <div class="col-4">First Name:</div>
                    <div class="col-8">${data.firstname}</div>
                  </div>
                  <div class="d-flex">
                    <div class="col-4">Last Name:</div>
                    <div class="col-8">${data.lastname}</div>
                  </div>
                </div>
              </div>
              <div class="col-6 p-2">
                <div class="border p-2">
                  <div class="d-flex">
                    <div class="col-4">SSN:</div>
                    <div class="col-8">${data.ssn}</div>
                  </div>
                  <div class="d-flex">
                    <div class="col-4">Date Of Birth:</div>
                    <div class="col-8">${data.dob}</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex">
              <table class="table">
                <thead>
                  <tr>
                    <th>Type / Site</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>ECPTOTE</span>
                        <span>https://ptot.texas.gov/pt-license-search/</span>
                      </div>
                    </td>
                    <td>${
                      statusData[0] === 0
                        ? "NA"
                        : statusData[0] === 1
                        ? "Good"
                        : "Bad"
                    }</td>
                  </tr>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>EMR DADS</span>
                        <span
                          >https://emr.dads.state.tx.us/DadsEMRWeb/emrRegistrySearch.js</span
                        >
                      </div>
                      p
                    </td>
                    <td>${
                      statusData[1] === 0
                        ? "NA"
                        : statusData[1] === 1
                        ? "Good"
                        : "Bad"
                    }</td>
                  </tr>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>Texas Medical Board</span>
                        <span>https://profile.tmb.state.tx.us/Search.aspx</span>
                      </div>
                    </td>
                    <td>${
                      statusData[2] === 0
                        ? "NA"
                        : statusData[2] === 1
                        ? "Good"
                        : "Bad"
                    }</td>
                  </tr>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>OIG Exclusion</span>
                        <span>https://exclusions.oig.hhs.gov</span>
                      </div>
                    </td>
                    <td>${
                      statusData[3] === 0
                        ? "NA"
                        : statusData[3] === 1
                        ? "Good"
                        : "Bad"
                    }</td>
                  </tr>
                  <tr>
                    <td scope="row">
                      <div class="d-flex flex-column">
                        <span>OIG HHSC</span>
                        <span
                          >https://oig.hhsc.state.tx.us/oigportal2/Exclusions</span
                        >
                      </div>
                    </td>
                    <td>${
                      statusData[4] === 0
                        ? "NA"
                        : statusData[4] === 1
                        ? "Good"
                        : "Bad"
                    }</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>`);
        $("#search-result").toggleClass("d-none");
      }

      function handleBackSearchPage() {
        $("#search-form").toggleClass("d-none");
        $("#search-result").toggleClass("d-none");
        statusData = [0, 0, 0, 0, 0];
      }
    </script>
  </body>
</html>
